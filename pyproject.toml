[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydome"
version = "0.1.0"
description = "A geodesic dome calculator: computes vertices and chords of Class I and Class II geodesic domes, with DXF/VRML/STL/OBJ export, a quick 3D preview image, and a hub-angle bill of materials."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Emily Williams" },
]
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]
mcp = ["mcp"]

[project.scripts]
pydome = "pydome.cli:main"
pydome-mcp = "pydome.mcp_server:main"

[tool.setuptools]
packages = ["pydome"]

[tool.pytest.ini_options]
testpaths = ["tests"]
